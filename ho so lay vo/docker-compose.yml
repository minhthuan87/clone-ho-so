version: '3.8'

services:
  ho-so-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ho_so_lay_vo_app
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/saved_profiles.json:/app/backend/saved_profiles.json
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: unless-stopped
